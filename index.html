<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Predictor</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- Main Form Card -->
                <div class="card shadow-sm border-dark">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0 fw-bold">Student Predictor</h4>
                    </div>
                    
                    <div class="card-body p-4">
                        <form id="predictionForm">
                            
                            <div class="row mb-3">
                                <div class="col-sm-8">
                                    <label class="form-label fw-bold">Name</label>
                                    <input type="text" id="studentName" class="form-control border-dark" required>
                                </div>
                                <div class="col-sm-4 mt-3 mt-sm-0">
                                    <label class="form-label fw-bold">Age</label>
                                    <input type="number" id="age" class="form-control border-dark" min="10" max="100" required>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-sm-4">
                                    <label class="form-label fw-bold small">Study (0-24h)</label>
                                    <input type="number" step="0.1" id="studyHours" class="form-control border-dark" min="0" max="24" required>
                                </div>
                                <div class="col-sm-4 mt-3 mt-sm-0">
                                    <label class="form-label fw-bold small">Sleep (0-24h)</label>
                                    <input type="number" step="0.1" id="sleepHours" class="form-control border-dark" min="0" max="24" required>
                                </div>
                                <div class="col-sm-4 mt-3 mt-sm-0">
                                    <label class="form-label fw-bold small">Phone (0-24h)</label>
                                    <input type="number" step="0.1" id="phoneUsage" class="form-control border-dark" min="0" max="24" required>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-sm-4">
                                    <label class="form-label fw-bold small">Attendance %</label>
                                    <input type="number" id="attendance" class="form-control border-dark" min="0" max="100" required>
                                </div>
                                <div class="col-sm-4 mt-3 mt-sm-0">
                                    <label class="form-label fw-bold small">Focus (1-10)</label>
                                    <input type="number" id="focusScore" class="form-control border-dark" min="1" max="10" required>
                                </div>
                                <div class="col-sm-4 mt-3 mt-sm-0">
                                    <label class="form-label fw-bold small">Stress (1-10)</label>
                                    <input type="number" id="stressLevel" class="form-control border-dark" min="1" max="10" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Select Model</label>
                                <select id="modelSelect" class="form-select border-dark" required>
                                    <option value="linear">Linear Regression</option>
                                    <option value="logistic">Logistic Regression (Ridge)</option>
                                    <option value="svm">Support Vector Machine (SVR)</option>
                                    <option value="naive_bayes">Naive Bayes</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-dark w-100 fw-bold py-2">Predict Score</button>
                        </form>
                    </div>
                </div>

                <!-- Result Box (Positioned Below the Form) -->
                <div id="resultBox" class="alert alert-dark border-dark mt-4 text-center shadow-sm d-none">
                    <h5 class="mb-0 fw-bold" id="resultText"></h5>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="model_weights.js"></script>
    <script src="script.js"></script>
</body>
</html>
